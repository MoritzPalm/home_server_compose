services:

  traefik:
    image: traefik:v3.7.9@sha256:652929a140a32d7cafafb13c6cdfab5376cfeff800f51397b87b524501ed02a8
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - dockerproxy
    ports:
      - ${LAN_IP}:80:80
      - ${HOST_IP}:80:80
      - ${LAN_IP}:443:443
      - ${HOST_IP}:443:443
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_token
    volumes:
      - ${CONFIG_PATH}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${CONFIG_PATH}/traefik/dynamic:/dynamic:ro
      - ${CONFIG_PATH}/traefik/acme:/acme
      - ${CONFIG_PATH}/traefik/secrets/cf_dns_token:/run/secrets/cf_dns_token:ro
      - ${CONFIG_PATH}/traefik/secrets/crowdsec_lapi_key:/run/secrets/crowdsec_lapi_key:ro
      - ${LOG_DIR}/traefik:/var/log/traefik
    networks:
      - external
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only capability needed: bind 80/443 inside the container.
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "homepage.group=Infrastructure"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik"
      - "homepage.href=https://traefik.${INTERNAL_DOMAIN}"
      - "homepage.description=Reverse proxy"

  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: traefik_dockerproxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - COLLECTIONS=${CROWDSEC_COLLECTIONS}
      - BOUNCER_KEY_traefik=${CROWDSEC_BOUNCER_KEY}
    volumes:
      - ${CONFIG_PATH}/crowdsec/config:/etc/crowdsec
      - ${CONFIG_PATH}/crowdsec/data:/var/lib/crowdsec/data
      - ${CONFIG_PATH}/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ${LOG_DIR}/traefik:/var/log/traefik:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    user: "65532:65532"
    volumes:
      - ${CONFIG_PATH}/cloudflared:/etc/cloudflared:ro
    networks:
      - external
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  external:
    external: true
  internal:
    external: true
