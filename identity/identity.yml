services:

  server:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik_server
    command: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=authentik_postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      - OIDC_VIKUNJA_SECRET=${OIDC_VIKUNJA_SECRET}
      - OIDC_TANDOOR_SECRET=${OIDC_TANDOOR_SECRET}
      - OIDC_IMMICH_SECRET=${OIDC_IMMICH_SECRET}
      - OIDC_PAPERLESS_SECRET=${OIDC_PAPERLESS_SECRET}
      - OIDC_AUDIOBOOKSHELF_SECRET=${OIDC_AUDIOBOOKSHELF_SECRET}
      - OIDC_KAVITA_SECRET=${OIDC_KAVITA_SECRET}
      - OIDC_SHELFARR_SECRET=${OIDC_SHELFARR_SECRET}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD}
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN}
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL}
    volumes:
      - ${CONFIG_PATH}/authentik/media:/media
      - ${CONFIG_PATH}/authentik/templates:/templates
      # read-only: authentik only reads blueprints, all state lives in postgres
      - ${CONFIG_PATH}/authentik/blueprints:/blueprints/custom:ro
    networks:
      - identity
      - external
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

      - "traefik.http.routers.authentik-internal.rule=Host(`auth.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.authentik-internal.entrypoints=websecure"
      - "traefik.http.routers.authentik-internal.service=authentik"
      - "traefik.http.routers.authentik-internal.middlewares=chain-public@file"

      - "traefik.http.routers.authentik-public.rule=Host(`auth.${PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.authentik-public.entrypoints=tunnel"
      - "traefik.http.routers.authentik-public.service=authentik"
      - "traefik.http.routers.authentik-public.middlewares=chain-public@file"

      - "homepage.group=Infrastructure"
      - "homepage.name=Authentik"
      - "homepage.icon=authentik"
      - "homepage.href=https://auth.${INTERNAL_DOMAIN}"
      - "homepage.description=Single sign-on"

  worker:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: authentik_worker
    command: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=authentik_postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_DISABLE_UPDATE_CHECK=true
      # Read by the blueprint !Env tag when creating OIDC providers. Putting
      # them only in the stack .env is not enough — that feeds compose variable
      # substitution, not the container's environment, and the blueprint then
      # fails with "client_secret: This field may not be null".
      - OIDC_VIKUNJA_SECRET=${OIDC_VIKUNJA_SECRET}
      - OIDC_TANDOOR_SECRET=${OIDC_TANDOOR_SECRET}
      - OIDC_IMMICH_SECRET=${OIDC_IMMICH_SECRET}
      - OIDC_PAPERLESS_SECRET=${OIDC_PAPERLESS_SECRET}
      - OIDC_AUDIOBOOKSHELF_SECRET=${OIDC_AUDIOBOOKSHELF_SECRET}
      - OIDC_KAVITA_SECRET=${OIDC_KAVITA_SECRET}
      - OIDC_SHELFARR_SECRET=${OIDC_SHELFARR_SECRET}
    volumes:
      - ${CONFIG_PATH}/authentik/media:/media
      - ${CONFIG_PATH}/authentik/templates:/templates
      - ${CONFIG_PATH}/authentik/blueprints:/blueprints/custom:ro
    networks:
      - identity
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: authentik_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=authentik
      - POSTGRES_DB=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - ${DATABASE_DIR}/authentik:/var/lib/postgresql/data
    networks:
      - identity
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


networks:
  identity:
    driver: bridge
  external:
    external: true
  internal:
    external: true
