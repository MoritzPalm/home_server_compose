# Uptime Kuma on the Pi monitor. Not deployed to mserver. The pi_monitor
# Ansible role reads the image line from this file on GitHub, so this pin is
# the one that runs and Renovate maintains it.
#
# Held on 1.x: the lucasheld.uptime_kuma collection that configures monitors
# talks to Kuma through uptime-kuma-api, which supports 1.x only.
services:

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime-kuma
    volumes:
      - ${DATABASE_DIR}/uptime-kuma:/app/data
    ports:
      - ${UPTIME_KUMA_PORT:-3002}:3001
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
