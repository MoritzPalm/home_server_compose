services:
  backend:
    container_name: hevy_backend
    image: ghcr.io/casudo/hevy-insights-backend:v1.8.6@sha256:38d012dc717905fcb2f2d6b199feec10414d95627657943b8167dbeb79cc5f75
    restart: unless-stopped
    environment:
      - X_API_KEY=${hevy_X_API_KEY}
    security_opt:
      - no-new-privileges:true
    hostname: hevy_backend

  frontend:
    container_name: hevy_frontend
    image: ghcr.io/casudo/hevy-insights-frontend:v1.8.6@sha256:c91f6a63da07c67779acaf4ba5143958e398f9758fe8d1b1a5953a34ceb01283
    restart: unless-stopped
    ports:
      - ${HOST_IP}:8123:8080
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    hostname: hevy_frontend
    labels:
      - "homepage.group=Fitness"
      - "homepage.name=Hevy Insights"
      - "homepage.icon=hevy"
      - "homepage.href=http://${HOST_IP}:8123"
      - "homepage.description=Workout analytics"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.hevy.rule=Host(`${HOST_HEVY}`)"
      - "traefik.http.routers.hevy.entrypoints=tunnel"
      - "traefik.http.routers.hevy.middlewares=chain-sso@file"
      - "traefik.http.services.hevy.loadbalancer.server.port=8080"
    networks:
      # 'default' keeps the link to the db/backend in this stack;
      # 'external' is only for Traefik to reach this container.
      - default
      - external

networks:
  default:
  external:
    external: true
