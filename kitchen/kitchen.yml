services:
  tandoor_db:
    image: postgres:18-alpine
    container_name: tandoor_db 
    hostname: tandoor_db
    environment:
      - POSTGRES_DB=${RECIPES_DB_NAME:-recipes}
      - POSTGRES_USER=${RECIPES_DB_USER:-djangodb}
      - POSTGRES_PASSWORD=${RECIPES_DB_PASSWORD}
    volumes:
      - ${DATABASE_DIR}/tandoor:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECIPES_DB_USER:-djangodb} -d ${RECIPES_DB_NAME:-recipes}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  tandoor:
    image: vabene1111/recipes:latest
    container_name: tandoor
    hostname: tandoor
    ports: 
      - 9815:80
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${RECIPES_DB_NAME:-recipes}
      - POSTGRES_USER=${RECIPES_DB_USER:-djangodb}
      - POSTGRES_PASSWORD=${RECIPES_DB_PASSWORD}
      
      - SECRET_KEY=${RECIPES_SECRET_KEY}
      - ALLOWED_HOSTS=${RECIPES_ALLOWED_HOSTS:-*}
      
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - recipes_staticfiles:/opt/recipes/staticfiles
      - ${MEDIA_DIR}/recipes/mediafiles:/opt/recipes/mediafiles
    depends_on:
      tandoor_db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Longer start period for migrations
    restart: unless-stopped

  
volumes:
  recipes_staticfiles:
    driver: local
