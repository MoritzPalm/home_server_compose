
services:
  plex-server:
    container_name: plex
    image: 'plexinc/pms-docker:latest'
    restart: always
    environment:
      - TZ=Europe/Berlin
      - VERSION=docker
      - HOSTNAME="PLEX_SERVER"
      - PLEX_CLAIM=claim-n3RF9y2y2jn6_pcRV-SQ
      - ADVERTISE_IP="http://192.168.178.35:32400/,http://130.185.16.42:32401/"
    ports:
       - 32401:32400/tcp
       - 32401:32400/udp
       - 3005:3005/tcp
       - 8324:8324/tcp
       - 32469:32469/tcp
       - 1900:1900/udp
       - 32410:32410/udp
       - 32412:32412/udp
       - 32413:32413/udp
       - 32414:32414/udp
    networks:
      - default
      - media_network
    devices:
      - "/dev/dri:/dev/dri" # Binds the Intel Quicksync decoder to Plex HW Transcode

    volumes:
      - "${CONFIG_PATH}:/config"
      - "/dev/shm:/transcode"
      - "${MEDIA_PATH}:/data/media"


networks:
  media_network:
    external: true

