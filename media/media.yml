
services:
  plex-server:
    container_name: plex
    image: 'plexinc/pms-docker:latest'
    restart: always
    environment:
      - TZ=Europe/Berlin
      - VERSION=docker
      - HOSTNAME=PLEX_SERVER
      - PLEX_CLAIM=claim-n3RF9y2y2jn6_pcRV-SQ
      - ADVERTISE_IP=http://192.168.178.35:32401/,http://130.185.16.42:32401/
    networks:
      - media_network
    ports:
       - 32401:32400/tcp
       - 32401:32400/udp    
       - 3005:3005/tcp
       - 8324:8324/tcp
       - 32469:32469/tcp
       - 1900:1900/udp
       - 32410:32410/udp
       - 32412:32412/udp
       - 32413:32413/udp
       - 32414:32414/udp
    devices:
      - "/dev/dri:/dev/dri" # Binds the Intel Quicksync decoder to Plex HW Transcode
    volumes:
      - "${CONFIG_PATH}/plex:/config"
      - "/dev/shm:/transcode"
      - "${MEDIA_PATH}:/data/media"
    labels:
      - "homepage.group=Media"
      - "homepage.name=Plex"
      - "homepage.icon=plex"
      - "homepage.href=http://${HOST_IP}:32401"
      - "homepage.description=Media server"

  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync
    environment:
      - PUID=1000
      - PGID=1000
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone
      - TZ=Europe/Berlin
    networks:
      - media_network
    ports:
      - "8008:8008"      # Main web app
      - "8888:8888"      # Spotify OAuth callback
      - "8889:8889"      # Tidal OAuth callback
    volumes:
      - ${CONFIG_PATH}/soulsync:/app/config
      - ${LOG_DIR}/soulsync:/app/logs
      - ${SOULSEEK_PATH}:/app/downloads:rw
      - ${MEDIA_PATH}/music:/app/Transfer:rw
      - soulsync_database:/app/database
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Music"
      - "homepage.name=SoulSync"
      - "homepage.icon=soulsync"
      - "homepage.href=http://${HOST_IP}:8008"
      - "homepage.description=Music sync"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    networks:
      - media_network
    ports:
      - 8096:8096       # HTTP web UI
      - 8920:8920       # HTTPS web UI
      - 7359:7359/udp   # Client auto-discovery
    devices:
      - "/dev/dri:/dev/dri"  # Intel Quicksync for HW transcode (shared with Plex)
    environment:
      - TZ=Europe/Berlin
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP}:8096
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin"
      - "homepage.href=http://${HOST_IP}:8096"
      - "homepage.description=Media server"


  stash:
    image: stashapp/stash:latest
    container_name: stash
    networks:
      - media_network
    ports:
      - 9999:9999
    environment:
      - TZ=Europe/Berlin
      - STASH_STASH=/data/xxx/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/root/.stash/
      - STASH_CACHE=/cache/
    volumes:
      - ${CONFIG_PATH}/stash:/root/.stash
      - ${CONFIG_PATH}/stash/generated:/generated
      - ${CONFIG_PATH}/stash/cache:/cache
      - ${MEDIA_PATH}/xxx:/data/xxx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9999/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Stash"
      - "homepage.icon=stash"
      - "homepage.href=http://${HOST_IP}:9999"
      - "homepage.description=Adult content library"


volumes:
  soulsync_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATABASE_DIR}/soulsync


networks:
  media_network:
    external: true
