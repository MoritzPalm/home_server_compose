
services:
  plex-server:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest@sha256:8f655bad7dcbc5398a78f70a5af12600b4ed3424f901566ed1eaa6710e9e2334
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    networks:
      - media_network
    ports:
       - 32400:32400/tcp
       - ${LAN_IP}:32401:32400/udp
       - ${LAN_IP}:3005:3005/tcp
       - ${LAN_IP}:8324:8324/tcp
       - ${LAN_IP}:32469:32469/tcp
       - ${LAN_IP}:1900:1900/udp
       - ${LAN_IP}:32410:32410/udp
       - ${LAN_IP}:32412:32412/udp
       - ${LAN_IP}:32413:32413/udp
       - ${LAN_IP}:32414:32414/udp
    devices:
      - "/dev/dri:/dev/dri" # Binds the Intel Quicksync decoder to Plex HW Transcode
    volumes:
      - "${CONFIG_PATH}/plex:/config"
      - "/dev/shm:/transcode"
      - "${MEDIA_PATH}:/data/media"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Media"
      - "homepage.name=Plex"
      - "homepage.icon=plex"
      - "homepage.href=http://${HOST_IP}:32401"
      - "homepage.description=Media server"

  soulsync:
    image: boulderbadgedad/soulsync:3.5.9@sha256:4f9b5a3d39f0585228020045da088098773371582f80e91c5c6ba52ce5036404
    container_name: soulsync
    environment:
      - PUID=1000
      - PGID=1000
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone
      - TZ=Europe/Berlin
    networks:
      - media_network
      - external
    ports:
      - ${HOST_IP}:8008:8008      # Main web app
      - ${HOST_IP}:8888:8888      # Spotify OAuth callback
      - ${HOST_IP}:8889:8889      # Tidal OAuth callback
    volumes:
      - ${CONFIG_PATH}/soulsync:/app/config
      - ${LOG_DIR}/soulsync:/app/logs
      - ${SOULSEEK_PATH}:/app/downloads:rw
      - ${MEDIA_PATH}/music:/app/Transfer:rw
      - soulsync_database:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Music"
      - "homepage.name=SoulSync"
      - "homepage.icon=soulsync"
      - "homepage.href=https://soulsync.${INTERNAL_DOMAIN}"
      - "homepage.description=Music sync"
      # The OAuth callbacks on 8888/8889 stay on the published ports.
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.soulsync.rule=Host(`soulsync.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.soulsync.entrypoints=websecure"
      - "traefik.http.routers.soulsync.middlewares=chain-public@file"
      - "traefik.http.services.soulsync.loadbalancer.server.port=8008"

  multi-scrobbler:
    image: foxxmd/multi-scrobbler:0.20.3@sha256:74c306b059f6953bc38d69372ca57260b616f2d98502189d32e14caba3c9e419
    container_name: multi-scrobbler
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      # external base URL — used to build UI links and the default OAuth
      # redirect. Overridden for Spotify below.
      - BASE_URL=https://multi-scrobbler.${INTERNAL_DOMAIN}
      # --- Spotify source. SPOTIFY_ID activates the source via ENV config. ---
      - SPOTIFY_ID=spotify
      - SPOTIFY_CLIENT_ID=${MS_SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${MS_SPOTIFY_CLIENT_SECRET}
      # temporary loopback redirect until traefik/https is configured; Spotify
      # rejects http on non-loopback. Complete OAuth over an ssh -L tunnel.
      - SPOTIFY_REDIRECT_URI=http://127.0.0.1:9078/callback
      # --- Plex source (API polling of /status/sessions, no Plex Pass needed).
      - PLEX_ID=plex
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${MS_PLEX_TOKEN}
      - PLEX_USERS_ALLOW=${MS_PLEX_USER}
      # --- ListenBrainz scrobble client (target). LZE_ID activates the client;
      # note creds use the LZ_ prefix but the id uses LZE_ (client vs source). ---
      - LZE_ID=listenbrainz
      - LZ_TOKEN=${MS_LISTENBRAINZ_TOKEN}
      - LZ_USER=${MS_LISTENBRAINZ_USER}
    networks:
      - media_network
      - external
    ports:
      - ${HOST_IP}:9078:9078      # Web UI + Spotify OAuth callback
    volumes:
      - ${CONFIG_PATH}/multi-scrobbler:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9078/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Music"
      - "homepage.name=Multi-Scrobbler"
      - "homepage.icon=listenbrainz"
      - "homepage.href=https://multi-scrobbler.${INTERNAL_DOMAIN}"
      - "homepage.description=Plex + Spotify → ListenBrainz scrobbling"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.multi-scrobbler.rule=Host(`multi-scrobbler.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.multi-scrobbler.entrypoints=websecure"
      - "traefik.http.routers.multi-scrobbler.middlewares=chain-public@file"
      - "traefik.http.services.multi-scrobbler.loadbalancer.server.port=9078"

  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    user: "1000:1000"
    networks:
      - media_network
      - external
    ports:
      - ${LAN_IP}:8096:8096
      - ${HOST_IP}:8096:8096   # HTTP web UI (LAN + tailnet)
      - ${LAN_IP}:8920:8920
      - ${HOST_IP}:8920:8920   # HTTPS web UI (LAN + tailnet)
      - ${LAN_IP}:7359:7359/udp   # Client auto-discovery
    devices:
      - "/dev/dri:/dev/dri"  # Intel Quicksync for HW transcode (shared with Plex)
    environment:
      - TZ=Europe/Berlin
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP}:8096
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin"
      - "homepage.href=https://jellyfin.${INTERNAL_DOMAIN}"
      - "homepage.description=Media server"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.middlewares=chain-public@file"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"


  stash:
    image: stashapp/stash:v0.31.1@sha256:df744af5a0c976e2ec671052ecc1f8a9aa757fa12b8f9930b59910b7295f0da6
    container_name: stash
    networks:
      - media_network
      - arr
      - external
    ports:
      - ${HOST_IP}:9999:9999
    environment:
      - TZ=Europe/Berlin
      - STASH_STASH=/data/xxx/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/root/.stash/
      - STASH_CACHE=/cache/
    volumes:
      - ${CONFIG_PATH}/stash:/root/.stash
      - ${CONFIG_PATH}/stash/generated:/generated
      - ${CONFIG_PATH}/stash/cache:/cache
      - ${MEDIA_PATH}/xxx:/data/xxx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Stash"
      - "homepage.icon=stash"
      - "homepage.href=https://stash.${INTERNAL_DOMAIN}"
      - "homepage.description=Adult content library"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.stash.rule=Host(`stash.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.stash.entrypoints=websecure"
      - "traefik.http.routers.stash.middlewares=chain-public@file"
      - "traefik.http.services.stash.loadbalancer.server.port=9999"

  immich-server:
    container_name: immich_server
    # Pinned, not ${IMMICH_VERSION:-release}: IMMICH_VERSION was never written to
    # the generated .env, so both Immich images silently tracked upstream
    # 'release' on every recreate — bypassing the digest pinning and the
    # update/frozen-review Renovate rule that exists specifically for immich-app.
    image: ghcr.io/immich-app/immich-server:v3.0.3@sha256:c716dc20f957aafd89fa9d284a2ec63e25c9e2d8d8e87c6197d540a3dce237db
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - IMMICH_CONFIG_FILE=/config/immich.json
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIG_PATH}/immich/config.json:/config/immich.json:ro
    ports:
      - ${HOST_IP}:2283:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - external
      - immich_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    labels:
      - "homepage.group=Media"
      - "homepage.name=Immich"
      - "homepage.icon=immich"
      - "homepage.href=https://${HOST_IMMICH}"
      - "homepage.description=Photo library"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.immich.rule=Host(`${HOST_IMMICH}`)"
      - "traefik.http.routers.immich.entrypoints=tunnel"
      - "traefik.http.routers.immich.middlewares=chain-public@file"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      
      

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: v3.0.3-cuda
    # Must be kept at the same version as immich-server above.
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3@sha256:d76fe88b69282c09a97eac4f82dafa82cfd77bce274bc742591cde974f87dacb
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false
    networks:
      - immich_internal

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    networks:
      - immich_internal

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    # newer immich requires VectorChord (vchord.so); vectors.so stays loaded so
    # existing pgvecto.rs data keeps working during/after the migration
    command: >-
      postgres -c shared_preload_libraries=vchord.so,vectors.so -c 'search_path="$$user", public, vectors' -c logging_collector=on -c max_wal_size=2GB -c shared_buffers=512MB -c wal_compression=on
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    networks:
      - immich_internal


volumes:
  model-cache:
  soulsync_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATABASE_DIR}/soulsync


networks:
  # pre-created by the ansible docker role and shared with the arr stack;
  # without external:true compose would create a project-scoped
  # media_media_network and the two stacks would not actually be connected
  media_network:
    external: true
  arr:
    external: true
  immich_internal:
    driver: bridge
  external:
    external: true
