
services:
  plex-server:
    container_name: plex
    image: 'plexinc/pms-docker:latest'
    restart: always
    environment:
      - TZ=Europe/Berlin
      - VERSION=docker
      - HOSTNAME=PLEX_SERVER
      - PLEX_CLAIM=claim-n3RF9y2y2jn6_pcRV-SQ
      - ADVERTISE_IP=http://192.168.178.35:32401/,http://130.185.16.42:32401/
    networks:
      - media_network
    ports:
       - 32401:32400/tcp
       - 32401:32400/udp    
       - 3005:3005/tcp
       - 8324:8324/tcp
       - 32469:32469/tcp
       - 1900:1900/udp
       - 32410:32410/udp
       - 32412:32412/udp
       - 32413:32413/udp
       - 32414:32414/udp
    devices:
      - "/dev/dri:/dev/dri" # Binds the Intel Quicksync decoder to Plex HW Transcode
    volumes:
      - "${CONFIG_PATH}/plex:/config"
      - "/dev/shm:/transcode"
      - "${MEDIA_PATH}:/data/media"
    labels:
      - "homepage.group=Media"
      - "homepage.name=Plex"
      - "homepage.icon=plex"
      - "homepage.href=http://${HOST_IP}:32401"
      - "homepage.description=Media server"

  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync
    environment:
      - PUID=1000
      - PGID=1000
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone
      - TZ=Europe/Berlin
    networks:
      - media_network
    ports:
      - "8008:8008"      # Main web app
      - "8888:8888"      # Spotify OAuth callback
      - "8889:8889"      # Tidal OAuth callback
    volumes:
      - ${CONFIG_PATH}/soulsync:/app/config
      - ${LOG_DIR}/soulsync:/app/logs
      - ${SOULSEEK_PATH}:/app/downloads:rw
      - ${MEDIA_PATH}/music:/app/Transfer:rw
      - soulsync_database:/app/database
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "homepage.group=Music"
      - "homepage.name=SoulSync"
      - "homepage.icon=soulsync"
      - "homepage.href=http://${HOST_IP}:8008"
      - "homepage.description=Music sync"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    networks:
      - media_network
    ports:
      - 8096:8096       # HTTP web UI
      - 8920:8920       # HTTPS web UI
      - 7359:7359/udp   # Client auto-discovery
    devices:
      - "/dev/dri:/dev/dri"  # Intel Quicksync for HW transcode (shared with Plex)
    environment:
      - TZ=Europe/Berlin
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP}:8096
    volumes:
      - ${CONFIG_PATH}/jellyfin/config:/config
      - ${CONFIG_PATH}/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin"
      - "homepage.href=http://${HOST_IP}:8096"
      - "homepage.description=Media server"


  stash:
    image: stashapp/stash:latest
    container_name: stash
    networks:
      - media_network
      - arr
    ports:
      - 9999:9999
    environment:
      - TZ=Europe/Berlin
      - STASH_STASH=/data/xxx/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/root/.stash/
      - STASH_CACHE=/cache/
    volumes:
      - ${CONFIG_PATH}/stash:/root/.stash
      - ${CONFIG_PATH}/stash/generated:/generated
      - ${CONFIG_PATH}/stash/cache:/cache
      - ${MEDIA_PATH}/xxx:/data/xxx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9999/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Stash"
      - "homepage.icon=stash"
      - "homepage.href=http://${HOST_IP}:9999"
      - "homepage.description=Adult content library"

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - media_network
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Media"
      - "homepage.name=Immich"
      - "homepage.icon=immich"
      - "homepage.href=http://${HOST_IP}:2283"
      - "homepage.description=Photo library"
      
      

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false
    networks:
      - media_network

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8436e10bc65c94886a91d4415b6a6dfa9cb5a306fb3b996e5bb67cd2b4854193
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    networks:
     - media_network 

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    command: >-
      postgres -c shared_preload_libraries=vectors.so -c 'search_path="$$user", public, vectors' -c logging_collector=on -c max_wal_size=2GB -c shared_buffers=512MB -c wal_compression=on
    restart: unless-stopped 
    security_opt:
      - no-new-privileges:true
    networks:
      - media_network


volumes:
  model-cache:
  soulsync_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATABASE_DIR}/soulsync


networks:
  media_network:
  arr:
    external: true
