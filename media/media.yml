version: '3.9'

services:
  plex-server:
    container_name: plex
    image: 'plexinc/pms-docker:latest'
    restart: always
    environment:
      - TZ=Europe/Berlin
      - VERSION=docker
      - HOSTNAME="PLEX_SERVER"
    ports:
       - 32401:32400/tcp
       - 32401:32400/udp
       - 3005:3005/tcp
       - 8324:8324/tcp
       - 32469:32469/tcp
       - 1900:1900/udp
       - 32410:32410/udp
       - 32412:32412/udp
       - 32413:32413/udp
       - 32414:32414/udp
    devices:
      - "/dev/dri:/dev/dri" # Binds the Intel Quicksync decoder to Plex HW Transcode

    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - /mnt/storage/media:/data/media




    
