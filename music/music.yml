services:
  soulsync:
    image: boulderbadgedad/soulsync:latest
    container_name: soulsync
    environment:
      - PUID=1000
      - PGID=1000
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - SOULSYNC_CONFIG_PATH=/app/config/config.json
      # Set timezone
      - TZ=Europe/Berlin
    networks:
      - default
      - media_network
    ports:
      - "8008:8008"      # Main web app
      - "8888:8888"      # Spotify OAuth callback
      - "8889:8889"      # Tidal OAuth callback
    volumes:
      - ${CONFIG_DIR}/soulsync:/app/config
      - ${LOG_DIR}/soulsync:/app/logs
      - ${TORRENT_PATH}:/downloads:rw
      - ${MEDIA_PATH}:/data/media:rw
      - soulsync_database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M



# Named volumes for persistent data
volumes:
  soulsync_database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATABASE_DIR}/soulsync

networks:
  media_network:
    external: true
