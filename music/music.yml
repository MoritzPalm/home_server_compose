services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${CONFIG_DIR}/beets:/config
      - ${MEDIA_DIR}:/music
      - ${TORRENT_DIR}:/downloads
    ports:
      - 8337:8337
    env_file: ".env"
    restart: unless-stopped
