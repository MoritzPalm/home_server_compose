services:

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: prometheus
    user: "65534:65534" # nobody user
    volumes:
      - ${CONFIG_PATH}/prometheus:/etc/prometheus:ro
      - ${DATABASE_DIR}/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - ${HOST_IP}:9090:9090
    # ordering only — prometheus handles down targets fine, so don't refuse
    # to start (and take monitoring down) just because an exporter is unhealthy
    depends_on:
      cadvisor:
        condition: service_started
      node-exporter:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: 
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Prometheus"
      - "homepage.icon=prometheus"
      - "homepage.href=http://${HOST_IP}:9090"
      - "homepage.description=Metrics"


  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.0@sha256:9b0ade5e607f9dbedb0a8e11151b6011ae5bd79304c261804cfdd2cadf200a80
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - ${HOST_IP}:9100:9100
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_TIME
    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: alertmanager
    user: "65534:65534"
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - ${HOST_IP}:9093:9093
    volumes:
      - ${CONFIG_PATH}/alertmanager:/etc/alertmanager:ro
      - ${DATABASE_DIR}/alertmanager:/alertmanager
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Alertmanager"
      - "homepage.icon=alertmanager"
      - "homepage.href=http://${HOST_IP}:9093"
      - "homepage.description=Alerts"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    command:
      - '--housekeeping_interval=55s'
      - '--docker_only'
    ports:
      - ${HOST_IP}:8082:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN  # Required for container metrics
    privileged: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=cAdvisor"
      - "homepage.icon=cadvisor"
      - "homepage.href=http://${HOST_IP}:8082"
      - "homepage.description=Container metrics"

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    container_name: grafana
    user: "472:472"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - ${HOST_IP}:3000:3000
    volumes:
      - ${DATABASE_DIR}/grafana:/var/lib/grafana
      - ${CONFIG_PATH}/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana"
      - "homepage.href=http://${HOST_IP}:3000"
      - "homepage.description=Dashboards"

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0@sha256:cfe22c36d7d2fac48ebf619707305acb65eb0fb670656eb80f356e606d782bc1
    container_name: smartctl-exporter
    privileged: true
    user: root
    command:
      - '--web.listen-address=:9902'
    ports:
      - "${HOST_IP}:9902:9902"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring

  # watchtower removed: containrrr/watchtower is unmaintained (last release
  # 2023) and its bundled Docker client (API 1.25) is rejected by the daemon
  # (min 1.40). We no longer auto-apply updates — WUD below detects updates and
  # notifies, and updates are applied deliberately by re-running the playbook.

  # Read-only, POST-blocking proxy in front of the docker socket. A :ro socket
  # bind does NOT make the docker API read-only (POST still works through it),
  # so wud and promtail previously had near-root API access. This proxy only
  # exposes the GET endpoints they need and refuses POST/exec/etc.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: monitoring_dockerproxy
    environment:
      - CONTAINERS=1   # wud + promtail: list/inspect containers, read logs
      - IMAGES=1       # wud: compare image tags/digests
      - INFO=1
      - VERSION=1
      - EVENTS=1       # promtail service discovery watches the event stream
      - POST=0         # deny all writes (create/start/kill/exec)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring

  whatsupdocker:
    image: getwud/wud:8.2.2@sha256:2df7cafa0fc84cdd66ad976163abc5390fa5995e0b5788a90e6a5303706bc21a
    container_name: wud
    depends_on:
      - dockerproxy
    environment:
      # talk to docker via the proxy, not the raw socket
      - WUD_WATCHER_LOCAL_HOST=dockerproxy
      - WUD_WATCHER_LOCAL_PORT=2375
      # WUD fires once per detected update (not on every scan) by default.
      - WUD_TRIGGER_DISCORD_1_URL=https://discord.com/api/webhooks/${WATCHTOWER_DISCORD_WEBHOOKID}/${WATCHTOWER_DISCORD_TOKEN}
      - WUD_TRIGGER_DISCORD_1_BOTUSERNAME=WUD
    ports:
      - ${HOST_IP}:3001:3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "homepage.group=Monitoring"
      - "homepage.name=WUD"
      - "homepage.icon=wud"
      - "homepage.href=http://${HOST_IP}:3001"
      - "homepage.description=Image update notifications"

  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    container_name: loki
    volumes:
      - ${CONFIG_PATH}/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - ${DATABASE_DIR}/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: promtail
    depends_on:
      - dockerproxy
    volumes:
      - ${CONFIG_PATH}/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ${DATABASE_DIR}/promtail:/positions
    command: -config.file=/etc/promtail/config.yml
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring


networks:
  monitoring:
    driver: bridge

