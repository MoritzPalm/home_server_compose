services:
  vikunja:
    image: vikunja/vikunja:2.4.0@sha256:1a5dd2d410b5359f689c77bbd1c66742cde1993f82d4adfe9aefa400ff1dd833
    container_name: vikunja
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${HOST_VIKUNJA}
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_JWT_SECRET}
    ports:
      - ${HOST_IP}:3456:3456
    volumes:
      - ${DATABASE_DIR}/vikunja-files:/app/vikunja/files
      - ${CONFIG_PATH}/vikunja/config.yml:/etc/vikunja/config.yml:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "homepage.group=Productivity"
      - "homepage.name=Vikunja"
      - "homepage.icon=vikunja"
      - "homepage.href=http://${HOST_IP}:3456"
      - "homepage.description=Task manager"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.vikunja.rule=Host(`${HOST_VIKUNJA}`)"
      - "traefik.http.routers.vikunja.entrypoints=tunnel"
      - "traefik.http.routers.vikunja.middlewares=chain-public@file"
      - "traefik.http.services.vikunja.loadbalancer.server.port=3456"
    networks:
      # 'default' keeps the link to the db/backend in this stack;
      # 'external' is only for Traefik to reach this container.
      - default
      - external
  db:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: vikunja_db
    environment:
      POSTGRES_PASSWORD: ${VIKUNJA_POSTGRES_PASSWORD}
      POSTGRES_USER: vikunja
    volumes:
      - ${DATABASE_DIR}/vikunja:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 2s
      start_period: 30s

networks:
  default:
  external:
    external: true
