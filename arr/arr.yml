    labels:
      - "homepage.group=Downloads"
      - "homepage.name=FlareSolverr"
      - "homepage.icon=flaresolverr"
      - "homepage.href=http://${HOST_IP}:8191"
      - "homepage.description=Cloudflare bypass"


  # image used for vpn killswitch network
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:b0ee2135e6ba52ad3f102aae9663707cd1c9531485117067a380d3b2b6dd991d
    container_name: gluetun
    cap_add: # docker drops all cap execpt added 
      - NET_ADMIN
    ports:
      - ${HOST_IP}:8088:8088 # qbittorrent http web ui
      - ${HOST_IP}:5030:5030 # soulseek web ui
      - ${HOST_IP}:5031:5031 # soulseek https web ui
      - ${HOST_IP}:9696:9696 # prowlarr web ui
      - ${HOST_IP}:8191:8191 # flaresolverr web ui
      - ${HOST_IP}:5010:5010 # Mousehole port
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      # see https://github.com/qdm12/gluetun-wiki for more details
      # example envs based on https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/mullvad.md
      - VPN_SERVICE_PROVIDER=protonvpn # define the vpn provider
      - OPENVPN_USER=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=on
      - FIREWALL_INPUT_PORTS=8088,5030,5031,9696,8191,5010
      - EXTRA_SUBNETS=192.168.178.0/24
      - FIREWALL_ALLOWED_SUBNETS=192.168.178.0/24
      - LISTENING_ADDRESS=0.0.0.0
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8088/api/v2/app/setPreferences 2>&1'
      #- IPV6_ENABLED=false
    volumes:
      - ${CONFIG_PATH}/gluetun:/gluetun
    security_opt:
     - no-new-privileges:true
    restart: unless-stopped
    networks:
      - arr
      - default
      - media_network


  # image used to download stuff; run over gluetun network (vpn killswitch)
  qbittorrent:
    image: linuxserver/qbittorrent:latest@sha256:2e074403c7b72e6d89cee3d0d41a47f7b5708c6a9e5316f3958c90765cbe12ce
    container_name: qbittorrent
    healthcheck:
      # Container may fail if the vpn's token expired, so mark as unhealthy when there is no internet connection
      # see: https://github.com/qdm12/gluetun/issues/641#issuecomment-933856220
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:8088", "https://google.com" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Berlin
      - WEBUI_PORT=8088
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${STORAGE_PATH}:/data
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: service:gluetun # use the gluetun container network (vpn killswitch)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "homepage.group=Downloads"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent"
      - "homepage.href=http://${HOST_IP}:8088"
      - "homepage.description=Torrent client"

  # keeps myanonamouse/torrentleech torrents force-resumed (bypassing queueing limits)
  # so seeding points/ratio keep accruing even once qbittorrent's queueing is enabled
  qbit-force-seed:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    container_name: qbit-force-seed
    depends_on:
      gluetun:
        condition: service_healthy
    networks:
      - arr
    volumes:
      - ./scripts/force_seed_private_trackers.py:/force_seed_private_trackers.py:ro
    command: ["python3", "/force_seed_private_trackers.py"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  overseerr:
    image: sctx/overseerr:1.35.0@sha256:6197516c9d7b58ccf113455e32aafb94df5d91995fe50e8c2cae6ba6c7c7b7de
    container_name: overseerr
    user: "1000:1000"
    depends_on:
      gluetun:
        condition: service_healthy
    ports:
      - ${HOST_IP}:5055:5055
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Berlin
      - PORT=5055 #optional
    security_opt:
     - no-new-privileges:true
    volumes:
      - ${CONFIG_PATH}/overseerr:/app/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - arr
      - media_network
      - external
    labels:
      - "homepage.group=Requests"
      - "homepage.name=Overseerr"
      - "homepage.icon=overseerr"
      - "homepage.href=http://${HOST_IP}:5055"
      - "homepage.description=Media requests"
      - "traefik.enable=true"
      - "traefik.docker.network=external"
      - "traefik.http.routers.overseerr.rule=Host(`${HOST_OVERSEERR}`)"
      - "traefik.http.routers.overseerr.entrypoints=tunnel"
      - "traefik.http.routers.overseerr.middlewares=chain-public@file"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"


