services:

  prowlarr:
    image: linuxserver/prowlarr:latest@sha256:2f3d31307beba3ba2dd226d191f5f5c14ee3b4d8b49277c64683f5ed97083179
    container_name: prowlarr
    # using a vpn here is mainly to use the existing MAM Session which is dynamically updated by the mousehole container
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Berlin
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config # database and Prowlarr configs
    security_opt:
      - no-new-privileges:true 
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:9696/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "homepage.group=Downloads"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr"
      - "homepage.href=http://${HOST_IP}:9696"
      - "homepage.description=Indexer manager"

