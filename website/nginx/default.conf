# Served behind Traefik's chain-public: HSTS, nosniff, frame and referrer
# headers come from there. Only what is specific to this page lives here.

# add_header is not inherited into a location that sets its own, so caching is
# decided by content type in one place instead of per location.
map $sent_http_content_type $cache_control {
    default              "no-cache";
    ~^font/              "public, max-age=31536000, immutable";
    ~^image/             "public, max-age=604800";
    ~^text/css           "public, max-age=86400";
    ~javascript          "public, max-age=86400";
    ~^application/pdf    "public, max-age=3600";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    # Nothing on the page loads from another origin: fonts, styles and scripts
    # ship with it. The JSON-LD block is data, which CSP does not govern.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/ld+json text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CV and anything else personal, mounted from outside the public repo.
    location /files/ {
        alias /files/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
